name: tests

on:
  push:
    branches: [dev, py3]
  pull_request:
    branches: [dev, py3]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package
        # setup.py probes for Boost and falls back to ext_modules=[]
        # when it isn't found, so this matrix runs on the pure-Python
        # path. The C++ extension is built and tested separately in
        # the 'boost' job (ubuntu-24.04, apt Boost, system Python).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Show installed package info
        run: pip show coniii

      - name: Run tests
        run: pytest coniii/ -v

  boost:
    name: boost-extension (ubuntu-24.04, system Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Boost and Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libboost-python-dev libboost-numpy-dev python3-dev python3-venv
      
      - name: Create venv from system Python
        # Ubuntu's Boost.Python/NumPy libraries are built for the system
        # interpreter (3.12 on 24.04), so the extension is built and run with it.
        run: |
          /usr/bin/python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      
      - name: Install package (builds the C++ extension)
        # numpy<2: Ubuntu's libboost-numpy is compiled against NumPy 1.x;
        # under NumPy 2, importing coniii segfaults.
        run: |
          python -m pip install --upgrade pip
          pip install -v -e ".[test]" "numpy<2"
      
      - name: Check the C++ extension was built and imports
        run: |
          python -c "from coniii import samplers; assert samplers.IMPORTED_SAMPLERS_EXT, 'C++ extension not imported'; print('samplers_ext OK')"

      - name: Show versions
        run: |
          python --version
          pip show numpy scipy numba | grep -E "^(Name|Version)"
          dpkg -l | grep -E "libboost-(python|numpy)1"

      - name: Run tests
        run: pytest coniii/ -v
