name: tests

on:
  push:
    branches: [dev, py3]
  pull_request:
    branches: [dev, py3]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package
        # setup.py probes for Boost and falls back to ext_modules=[]
        # when it isn't found, so this build runs on the pure-Python
        # path. The Boost C++ extension is not built or tested in CI;
        # only the pure-Python sampler implementations are covered here.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Show installed package info
        run: pip show coniii

      - name: Run tests
        run: pytest coniii/ -v
