# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

sphinx:
  configuration: docs/conf.py
  # Do not fail the build on warnings: importing coniii.legacy.* for
  # autodoc legitimately emits DeprecationWarnings.
  fail_on_warning: false

python:
  install:
    # Install the package itself (so autodoc can import it) plus the
    # docs extra (sphinx + sphinx_rtd_theme). The Boost C++ extension is
    # not built on RTD; samplers.py imports it in a try/except, so the
    # pure-Python path is used for documentation.
    - method: pip
      path: .
      extra_requirements:
        - docs
